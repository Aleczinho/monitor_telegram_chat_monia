version: "3.8"

services:
  api:
    image: ghcr.io/aleczinho/monitor_telegram_chat_omnia:latest
    networks:
      - omnia
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8067"
      DATABASE_PATH: /data/events.sqlite3
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Configure GITHUB_WEBHOOK_SECRET in the Portainer stack}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-healthdevio/projeto-itia-dois}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-1048576}
    ports:
      - target: 8067
        published: 8067
        protocol: tcp
        mode: host
    volumes:
      - monitor_data:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8067/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == compute01
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

  worker:
    image: ghcr.io/aleczinho/monitor_telegram_chat_omnia:latest
    networks:
      - omnia
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/events.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Configure TELEGRAM_BOT_TOKEN in the Portainer stack}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Configure TELEGRAM_CHAT_ID in the Portainer stack}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-8}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-2}
      DEDUP_RETENTION_DAYS: ${DEDUP_RETENTION_DAYS:-90}
    volumes:
      - monitor_data:/data
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == compute01
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

volumes:
  monitor_data:
    driver: local

networks:
  omnia:
    external: true
    name: projeto-itia-2_omnia_net
